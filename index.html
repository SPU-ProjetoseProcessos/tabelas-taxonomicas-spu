<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabelas Taxonômicas da SPU</title>
<meta name="description" content="Consulta às tabelas taxonômicas da Secretaria do Patrimônio da União: navegação em árvore e em mapa, filtros e ligação com o glossário.">
<!-- o sufixo ?v= evita que o navegador sirva a versão anterior depois de uma publicação -->
<link rel="stylesheet" href="estilo.css?v=20261027d">
</head>
<body>
<a class="pular" href="#principal">Pular para o conteúdo</a>

<header class="topo">
  <div class="interno">
    <button class="marca" id="irInicio" type="button" aria-label="Voltar ao início">
      <span class="marca-texto">
        <span class="marca-nome"><b>SPU</b><span>Taxonomias</span></span>
        <span class="marca-autoria">CGGES — Escritório de Processos</span>
      </span>
      <span class="marca-barras" aria-hidden="true">
        <i style="height:9px;background:var(--marca-1)"></i>
        <i style="height:15px;background:var(--marca-2)"></i>
        <i style="height:20px;background:var(--marca-3)"></i>
        <i style="height:13px;background:var(--marca-4)"></i>
        <i style="height:7px;background:var(--marca-1)"></i>
      </span>
    </button>
    <div class="modulo">
      <strong>Tabelas Taxonômicas</strong>
      <span>Secretaria do Patrimônio da União</span>
    </div>
  </div>
</header>

<nav class="faixa-trilha" aria-label="Trilha de navegação">
  <div class="interno trilha" id="trilha"></div>
</nav>

<main id="principal">

  <div class="cabeca-pagina">
    <span class="sigla" id="siglaTabela" hidden></span>
    <h1 id="tituloPagina">Tabelas Taxonômicas</h1>
    <div class="fio"></div>
    <p class="dominio-pagina" id="dominioTabela" hidden></p>
    <div class="busca-pagina" role="search">
      <label class="pular" for="busca">Pesquisar</label>
      <input id="busca" type="search" autocomplete="off" placeholder="Pesquisar">
      <div class="escopos" id="escopos" role="group" aria-label="Em quais tabelas pesquisar"></div>
    </div>
  </div>

  <!-- ------------------------------------------------------------ home -->
  <section id="home">
    <div class="atalho">
      <label for="atalhoTabela">Ir direto para</label>
      <select id="atalhoTabela"></select>
    </div>
    <div class="cards" id="cards"></div>
    <p class="resumo-acervo" id="resumoAcervo"></p>
  </section>

  <!-- ------------------------------------------------------ resultados -->
  <section id="secaoResultados" hidden>
    <div class="bloco">
      <ul class="lista-resultados" id="resultados"></ul>
    </div>
  </section>

  <!-- ---------------------------------------------------------- tabela -->
  <section id="secaoTabela" hidden>
    <!-- aviso de tabela não aprovada; preenchido por JS a partir de tabela.json -->
    <div class="tarja-minuta" id="tarjaMinuta" role="note" hidden></div>
    <div class="barra">
      <div class="abas" role="tablist" aria-label="Modo de navegação">
        <button id="abaArvore" role="tab" aria-selected="true" aria-controls="caixaArvore">Árvore</button>
        <button id="abaMapa" role="tab" aria-selected="false" aria-controls="caixaMapa">Mapa</button>
      </div>
      <button class="botao" id="botaoFiltros" aria-expanded="false" aria-controls="filtros" hidden>Filtros</button>
      <span class="contagem" id="contagem"></span>
      <span class="espaco"></span>
      <button class="botao" id="baixarCSV">Baixar CSV</button>
    </div>

    <div class="filtros" id="filtros" hidden></div>

    <div class="area">
      <div>
        <div class="bloco" id="caixaArvore" role="tabpanel" aria-labelledby="abaArvore">
          <div class="corpo">
            <ul class="arvore" id="arvore" role="tree" aria-label="Estrutura da tabela"></ul>
          </div>
        </div>

        <div class="bloco" id="caixaMapa" role="tabpanel" aria-labelledby="abaMapa" hidden>
          <svg id="mapa" role="img" aria-label="Mapa da taxonomia. A mesma estrutura está na aba Árvore, navegável por teclado."></svg>
          <div class="controles-mapa">
            <button class="botao" id="centralizar">Centralizar</button>
            <button class="botao" id="expandirTudo">Explodir tudo</button>
            <button class="botao" id="recolherTudo">Recolher</button>
            <span>Clique no <strong>+</strong> para abrir o galho e no item para ver a ficha. Arraste para mover, roda do mouse para aproximar.</span>
          </div>
        </div>
      </div>

      <aside class="bloco ficha" id="ficha" aria-live="polite"></aside>
    </div>
  </section>

</main>

<footer id="rodape"></footer>
<script src="app.js?v=20261027d"></script>
</body>
</html>
