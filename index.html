<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabelas Taxonômicas da SPU</title>
<meta name="description" content="Consulta às tabelas taxonômicas da Secretaria do Patrimônio da União: navegação em árvore e em mapa, filtros e ligação com o glossário.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<a class="pular" href="#principal">Pular para o conteúdo</a>

<header class="topo">
  <nav class="trilha" id="trilha" aria-label="Você está em"></nav>
  <div class="busca" role="search">
    <label class="pular" for="busca">Pesquisar</label>
    <input id="busca" type="search" autocomplete="off"
           placeholder="Pesquisar nas tabelas e no glossário">
    <div class="escopos" id="escopos" role="group" aria-label="Onde pesquisar"></div>
  </div>
</header>

<main id="principal">

  <!-- ------------------------------------------------------------ home -->
  <section id="home">
    <div class="hero">
      <h1>Tabelas Taxonômicas</h1>
      <div class="fio"></div>
    </div>

    <div class="atalho">
      <label for="atalhoTabela">Ir direto para</label>
      <select id="atalhoTabela"></select>
    </div>

    <div class="cards" id="cards"></div>

    <p class="resumo-acervo" id="resumoAcervo"></p>
  </section>

  <!-- ------------------------------------------------------ resultados -->
  <section id="secaoResultados" hidden>
    <div class="hero" style="padding-bottom:18px">
      <h1 id="tituloResultados">Resultados</h1>
      <div class="fio"></div>
    </div>
    <div class="bloco">
      <ul class="lista-resultados" id="resultados"></ul>
    </div>
  </section>

  <!-- ---------------------------------------------------------- tabela -->
  <section id="secaoTabela" hidden>
    <div class="cabeca">
      <span class="sigla" id="siglaTabela"></span>
      <h1 id="tituloTabela"></h1>
      <p id="dominioTabela"></p>
    </div>

    <div class="barra">
      <button class="botao inicio" id="voltarInicio" title="Voltar ao início" aria-label="Voltar ao início">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"
                fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="abas" role="tablist" aria-label="Modo de navegação">
        <button id="abaArvore" role="tab" aria-selected="true" aria-controls="caixaArvore">Árvore</button>
        <button id="abaMapa" role="tab" aria-selected="false" aria-controls="caixaMapa">Mapa</button>
      </div>
      <button class="botao" id="botaoFiltros" aria-expanded="false" aria-controls="filtros" hidden>Filtros</button>
      <span class="contagem" id="contagem"></span>
      <span class="espaco"></span>
      <button class="botao" id="baixarCSV">Baixar CSV</button>
    </div>

    <div class="filtros" id="filtros" hidden></div>

    <div class="area">
      <div>
        <div class="bloco" id="caixaArvore" role="tabpanel" aria-labelledby="abaArvore">
          <div class="corpo">
            <ul class="arvore" id="arvore" role="tree" aria-label="Estrutura da tabela"></ul>
          </div>
        </div>

        <div class="bloco" id="caixaMapa" role="tabpanel" aria-labelledby="abaMapa" hidden>
          <svg id="mapa" role="img" aria-label="Mapa da taxonomia. A mesma estrutura está na aba Árvore, navegável por teclado."></svg>
          <div class="controles-mapa">
            <button class="botao" id="centralizar">Centralizar</button>
            <button class="botao" id="expandirTudo">Explodir tudo</button>
            <button class="botao" id="recolherTudo">Recolher</button>
            <span>Clique no <strong>+</strong> para abrir o galho e no item para ver a ficha. Arraste para mover, roda do mouse para aproximar.</span>
          </div>
        </div>
      </div>

      <aside class="bloco ficha" id="ficha" aria-live="polite"></aside>
    </div>
  </section>

</main>

<footer id="rodape"></footer>
<script src="app.js"></script>
</body>
</html>
